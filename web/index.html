<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>ragana</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <img src="icon.png" alt="" class="logo" width="28" height="28">
    <h1>ragana</h1>
  </div>
  <!-- Кнопки в шапке, а не только в скрытой секции: индексация и сброс
       нужны в любой момент, а секция состояния появляется лишь после
       выбора папки. Отключены до загрузки движка. -->
  <div class="bar-actions">
    <button id="btn-folder" class="ghost icon-btn" title="Выбрать папку">📁</button>
    <button id="btn-index-top" class="ghost icon-btn" title="Проиндексировать изменения" disabled>⟳</button>
    <button id="btn-reset-top" class="ghost icon-btn danger" title="Сбросить индекс" disabled>🗑</button>
  </div>
</header>

<main>
  <section id="setup" class="card">
    <p class="muted">Выберите папку с документами. Файлы не покидают устройство.</p>
    <button id="btn-pick" class="primary">Выбрать папку</button>
    <p id="fallback-note" class="muted small hidden">
      Браузер не поддерживает выбор папки — используйте добавление файлов.
      <input type="file" id="file-input" multiple hidden>
      <button id="btn-files" class="ghost">Добавить файлы</button>
    </p>
  </section>

  <section id="status" class="card hidden">
    <div class="row">
      <div><strong id="stat-files">0</strong><span class="muted"> файлов</span></div>
      <div><strong id="stat-chunks">0</strong><span class="muted"> фрагментов</span></div>
      <div id="stat-dir" class="muted small ellipsis"></div>
    </div>
    <div class="actions">
      <button id="btn-index" class="primary">Проиндексировать изменения</button>
      <button id="btn-reset" class="ghost danger">Сбросить</button>
    </div>
    <div id="progress" class="progress hidden">
      <div class="track"><div id="bar" class="fill"></div></div>
      <div id="progress-text" class="muted small"></div>
    </div>
    <div id="diff" class="muted small"></div>
  </section>

  <!-- Панель поиска и вывод цитат монтирует React (web/ui.js).
       Выбор папки и индексация остались на обычном DOM: переписывать
       работающее ради единообразия незачем. -->
  <div id="search-root" class="hidden"></div>
</main>

<div id="toast" class="toast hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
